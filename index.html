<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      animation: fadeIn 2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .btn-start {
      background-color: #ff5e78;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
    }
    .btn-start:hover {
      background-color: #ff3c61;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hey Sayali❤️</h1>
    <p>Before anything else... I just want to say one thing.</p>
    <a href="letter.html" class="btn btn-start mt-3">I'm Sorry</a>
  </div>
</body>
</html>
