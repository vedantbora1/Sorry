<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Memories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #fceabb;
      background: linear-gradient(to right, #a53e9e, #fceabb);
      font-family: 'Arial', sans-serif;
      padding: 40px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      animation: fadeIn 1s;
    }
    .memory-img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    .container {
  text-align: center;
  margin-top: 50px;
}

.container h1 {
  font-size: 2rem;
  color: #ffffff;
  text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
  margin-bottom: 20px;
}

.btn-start {
  background-color: #ff69b4;
  color: white;
  font-weight: bold;
  padding: 10px 20px;
  border-radius: 25px;
  text-transform: uppercase;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: background-color 0.3s, transform 0.2s;
}

.btn-start:hover {
  background-color: #ff85c1;
  transform: scale(1.05);
}

  </style>
</head>
<body>
  <h2 class="text-center mb-4">Our Sweet Memories</h2>
  <div class="gallery">
    <img src="IMG_9754.JPG" alt="Memory 1" class="memory-img" />
    <img src="PXL_20240830_125139630.PORTRAIT.jpg" alt="Memory 2" class="memory-img" />
    <img src="PXL_20241006_145311991.jpg" alt="Memory 3" class="memory-img" />
    <img src="PXL_20250305_083439080.PORTRAIT.jpg" alt="Memory 4" class="memory-img" />
  </div>
  <div class="container">
   
    <a href="forgive.html" class="btn btn-start mt-3">Click Here</a>
  </div>
</body>
</html>
