<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgive Me</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #d3f4ff;
      font-family: 'Comic Sans MS', cursive;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .message {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      animation: bounce 1s;
    }
    @keyframes bounce {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .btn-love {
      background-color: #ff69b4;
      color: white;
      border: none;
      margin-top: 20px;
    }
    .btn-love:hover {
      background-color: #ff1493;
    }
  </style>
</head>
<body>
  <div class="message">
    <h2>Please ek chance Sayali 🥺</h2>
    <p>Pata nhi kesa lag raha hoga ye dhek kr but karde n maaf aur karte firse ek baar 😁😁</p>
    <a href="index.html" class="btn btn-love">Restart 💞</a>
  </div>
</body>
</html>
